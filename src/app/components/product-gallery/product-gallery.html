<section
  id="gallery"
  class="scroll-mt-24 border-b border-wood-200 bg-cream-50 py-16 sm:py-20"
  aria-labelledby="gallery-heading"
>
  <div class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8">
    <div class="max-w-2xl">
      <h2 id="gallery-heading" class="text-3xl font-extrabold text-wood-950 sm:text-4xl">
        أقسام المنتجات
      </h2>
      <p class="mt-3 text-lg text-ink-muted">
        تصفّح أعمالنا حسب التخصص — اختر القسم لعرض النماذج فوراً.
      </p>
    </div>

    <!-- تبويبات التصفية -->
    <div
      class="mt-8 flex gap-2 overflow-x-auto pb-2 [-ms-overflow-style:none] [scrollbar-width:none] sm:flex-wrap sm:overflow-visible [&::-webkit-scrollbar]:hidden"
      role="tablist"
      aria-label="أقسام المنتجات"
    >
      @for (tab of categories; track tab.id) {
        <button
          type="button"
          role="tab"
          [attr.aria-selected]="isActive(tab.id)"
          class="shrink-0 rounded-full border px-4 py-2 text-sm font-bold transition focus:outline-none focus-visible:ring-2 focus-visible:ring-wood-500 sm:text-base"
          [class.border-wood-800]="isActive(tab.id)"
          [class.bg-wood-800]="isActive(tab.id)"
          [class.text-cream-50]="isActive(tab.id)"
          [class.shadow-md]="isActive(tab.id)"
          [class.border-wood-200]="!isActive(tab.id)"
          [class.bg-white]="!isActive(tab.id)"
          [class.text-wood-900]="!isActive(tab.id)"
          [class.hover:border-wood-300]="!isActive(tab.id)"
          (click)="selectCategory(tab.id)"
        >
          {{ tab.label }}
        </button>
      }
    </div>

    <!-- شبكة البطاقات — مربوطة بـ filteredProducts -->
    <div
      class="mt-10 grid gap-6 sm:grid-cols-2 lg:grid-cols-3"
      role="tabpanel"
      [attr.aria-label]="'منتجات القسم'"
    >
      @for (product of filteredProducts(); track product.id) {
        <article
          class="group flex flex-col overflow-hidden rounded-2xl border border-wood-200 bg-white shadow-card transition hover:-translate-y-0.5 hover:shadow-lift"
        >
          <div class="relative aspect-[4/3] overflow-hidden bg-wood-100">
            <img
              [src]="product.imageSrc"
              [alt]="product.title"
              class="h-full w-full object-cover transition duration-500 group-hover:scale-[1.03]"
              loading="lazy"
              decoding="async"
            />
          </div>
          <div class="flex flex-1 flex-col gap-4 p-5">
            <h3 class="text-lg font-bold leading-snug text-wood-950">{{ product.title }}</h3>
            <a
              class="mt-auto inline-flex items-center justify-center gap-2 rounded-full bg-emerald-700 px-4 py-2.5 text-sm font-bold text-white transition hover:bg-emerald-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500"
              [href]="whatsappUrl(product.title)"
              target="_blank"
              rel="noopener noreferrer"
            >
              <svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path
                  d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"
                />
              </svg>
              استفسار عبر الواتساب
            </a>
          </div>
        </article>
      }
    </div>
  </div>
</section>
